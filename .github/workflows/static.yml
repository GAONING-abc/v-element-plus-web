name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: List root files   # ✅【新增调试步骤】列出根目录全部文件，用来查看检出拿到了哪些文件
        run: ls -la .
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # ✅保留 . ，读取仓库根目录（适配你：无dist文件夹，index.html直接在根）
      - name: GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
