name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 新建临时文件夹_site，把首页、静态资源复制进去
      - name: Prepare static files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp .nojekyll _site/
          ls -la _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
          include-hidden-files: true

      - name: GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
